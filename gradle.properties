org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Version name is <appVersionBase>.<build number>; the build number is the CI run number and is
# also the versionCode, so every release installs over the previous one.
appVersionBase=1.0
